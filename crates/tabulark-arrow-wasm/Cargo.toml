[package]
name = "tabulark-arrow-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "tabulark_arrow"
crate-type = ["cdylib"]

[dependencies]
arrow-ipc = { version = "=59.1.0", default-features = false, features = ["zstd"] }
js-sys = "=0.3.77"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tabulark = { path = "../..", default-features = false, features = ["arrow"] }
wasm-bindgen = "=0.2.100"

[lints.rust]
unsafe_code = "forbid"
