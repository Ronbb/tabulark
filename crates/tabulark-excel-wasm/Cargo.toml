[package]
name = "tabulark-excel-wasm"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "tabulark_excel"
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = { version = "=0.35.0", default-features = false }
cfb = "=0.7.3"
js-sys = "=0.3.77"
quick-xml = { version = "=0.39.4", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
tabulark = { path = "../..", default-features = false }
wasm-bindgen = "=0.2.100"
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
