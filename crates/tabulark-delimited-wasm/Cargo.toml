[package]
name = "tabulark-delimited-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "tabulark_delimited"
crate-type = ["cdylib"]

[dependencies]
tabulark = { path = "../..", default-features = false, features = ["wasm"] }
wasm-bindgen = "=0.2.100"

[lints.rust]
unsafe_code = "forbid"
