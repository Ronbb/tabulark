[package]
name = "tabulark-parquet-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "tabulark_parquet"
crate-type = ["cdylib"]

[dependencies]
js-sys = "=0.3.77"
parquet = { version = "=59.1.0", default-features = false, features = ["zstd"] }
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tabulark = { path = "../..", default-features = false, features = ["parquet"] }
wasm-bindgen = "=0.2.100"

[lints.rust]
unsafe_code = "forbid"
