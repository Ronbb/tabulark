[package]
name = "tabulark-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
arrow-ipc = { version = "=59.1.0", default-features = false, features = ["zstd"] }
parquet = { version = "=59.1.0", default-features = false, features = ["zstd"] }
tabulark = { path = "..", features = ["arrow", "parquet"] }
tabulark-excel = { package = "tabulark-excel-wasm", path = "../crates/tabulark-excel-wasm" }

[patch.crates-io]
zstd = { path = "../crates/zstd-pure-compat" }

# The production crate also emits a cdylib. Its cargo-fuzz linkage is currently
# maintained on Linux/WSL; keeping libFuzzer Unix-scoped preserves the stable
# deterministic smoke path on Windows.
[target.'cfg(unix)'.dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "csv_lifecycle"
path = "fuzz_targets/csv_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arrow_lifecycle"
path = "fuzz_targets/arrow_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parquet_lifecycle"
path = "fuzz_targets/parquet_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "excel_lifecycle"
path = "fuzz_targets/excel_lifecycle.rs"
test = false
doc = false
bench = false

# This is deliberately an independent workspace. The production workspace
# stays free of libFuzzer-only dependencies and continues to use its lockfile.
[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
