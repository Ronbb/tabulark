name: Remote RangeSource

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-range-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-remote-source:
    name: Contracts, package, and three-browser runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          target="x86_64-unknown-linux-musl"
          archive="wasm-bindgen-${version}-${target}.tar.gz"
          checksum="${archive}.sha256sum"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/$checksum" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
          expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stable API and RangeSource contracts
        run: |
          npm run typecheck
          npm test

      - name: Build the real Worker and WebAssembly runtimes
        run: npm run build:pages

      - name: Check the packed consumer and package size budgets
        run: |
          npm run package:check
          npm run benchmark:size

      - name: Install pinned desktop browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Exercise remote formats in Chromium, Firefox, and WebKit
        run: >-
          npx --no-install playwright test
          test/browser/remote-range-source.spec.mjs
          --project=chromium --project=firefox --project=webkit
          --workers=1 --retries=0

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remote-range-source-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
