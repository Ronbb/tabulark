name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build playground site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust for WebAssembly build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            target="x86_64-unknown-linux-musl"
            archive="wasm-bindgen-${version}-${target}.tar.gz"
            checksum="${archive}.sha256sum"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$archive" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$checksum" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
            expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Test the assembled Pages artifact
        run: >-
          npx --no-install playwright test
          test/browser/site.spec.mjs
          test/browser/example.spec.mjs
          test/browser/arrow.spec.mjs
          test/browser/formats.spec.mjs

      - name: Enforce package and site size budgets
        run: npm run benchmark:size

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages

  deploy:
    name: Deploy playground site
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Smoke-test the deployed Pages URL
        env:
          TABULARK_DEPLOYED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx --no-install playwright test test/browser/pages-deployed.spec.mjs
