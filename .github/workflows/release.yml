name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    # The release gate includes the same Chromium visual suite as CI.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            target="x86_64-unknown-linux-musl"
            archive="wasm-bindgen-${version}-${target}.tar.gz"
            checksum="${archive}.sha256sum"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$archive" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$checksum" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
            expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(node scripts/check-versions.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm --locked

      - name: Build JavaScript and WebAssembly
        run: npm run build

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run JavaScript tests
        run: npm test

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Upload browser traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check registry packages
        run: |
          cargo package --locked
          npm pack --dry-run

  publish-crate:
    name: Publish crate
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io version
        id: availability
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "https://index.crates.io/ta/bu/tabulark" \
            | grep "\"vers\":\"${VERSION}\"" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tabulark ${VERSION} already exists on crates.io; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io
        if: steps.availability.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.availability.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish npm package
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check npm version
        id: availability
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/tabulark/${VERSION}")"
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "tabulark ${VERSION} already exists on npm; skipping."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected npm response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Install Node.js
        if: steps.availability.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Rust for WebAssembly build
        if: steps.availability.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        if: steps.availability.outputs.publish == 'true'
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            target="x86_64-unknown-linux-musl"
            archive="wasm-bindgen-${version}-${target}.tar.gz"
            checksum="${archive}.sha256sum"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$archive" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$checksum" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
            expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"
          fi

      - name: Install an OIDC-capable npm CLI
        if: steps.availability.outputs.publish == 'true'
        run: npm install --global npm@11

      - name: Install dependencies
        if: steps.availability.outputs.publish == 'true'
        run: npm ci

      - name: Build JavaScript and WebAssembly
        if: steps.availability.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.availability.outputs.publish == 'true'
        run: npm publish
