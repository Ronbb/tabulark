name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Check fuzz harness
        run: cargo test --manifest-path fuzz/Cargo.toml --locked

      - name: Replay fuzz seeds
        run: cargo run --manifest-path fuzz/Cargo.toml --bin csv_lifecycle --locked

      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm --locked

      - name: Check crate package
        run: cargo package --locked

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust for WebAssembly build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n 1)"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi

      - name: Build JavaScript and WebAssembly
        run: npm run build

      - name: Check synchronized versions
        run: npm run check:versions

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run JavaScript tests
        run: npm test

      - name: Smoke-test large fixture generation
        run: node test/performance/generate-csv.mjs --size 2MiB --output target/bench/smoke.csv

      - name: Check npm package
        run: npm pack --dry-run

  browser:
    name: Chromium Worker, accessibility, and visual integration
    # Screenshot baselines are maintained against Playwright Chromium on this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n 1)"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Build JavaScript and WebAssembly
        run: npm run build

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
