name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Check fuzz harness
        run: cargo test --manifest-path fuzz/Cargo.toml --locked

      - name: Replay fuzz seeds
        run: |
          cargo run --manifest-path fuzz/Cargo.toml --bin csv_lifecycle --locked
          cargo run --manifest-path fuzz/Cargo.toml --bin arrow_lifecycle --locked

      - name: Check WebAssembly target
        run: |
          cargo check --package tabulark-delimited-wasm --target wasm32-unknown-unknown --locked
          cargo check --package tabulark-arrow-wasm --target wasm32-unknown-unknown --locked

      - name: Check crate package
        run: cargo package --locked

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust for WebAssembly build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            target="x86_64-unknown-linux-musl"
            archive="wasm-bindgen-${version}-${target}.tar.gz"
            checksum="${archive}.sha256sum"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$archive" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$checksum" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
            expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"
          fi

      - name: Build JavaScript and WebAssembly
        run: npm run build

      - name: Check synchronized versions
        run: npm run check:versions

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run JavaScript tests
        run: npm test

      - name: Smoke-test large fixture generation
        run: node test/performance/generate-csv.mjs --size 2MiB --output target/bench/smoke.csv

      - name: Check npm package
        run: npm run package:check

  browser:
    name: Chromium Worker, accessibility, and visual integration
    # Screenshot baselines are maintained against Playwright Chromium on this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-default-features --features wasm | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')"
          if ! command -v wasm-bindgen > /dev/null || ! wasm-bindgen --version | grep -Fx "wasm-bindgen $version" > /dev/null; then
            target="x86_64-unknown-linux-musl"
            archive="wasm-bindgen-${version}-${target}.tar.gz"
            checksum="${archive}.sha256sum"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$archive" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$RUNNER_TEMP/$checksum" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${checksum}"
            expected="$(awk '{ print $1 }' "$RUNNER_TEMP/$checksum")"
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/wasm-bindgen-${version}-${target}" >> "$GITHUB_PATH"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Build JavaScript and WebAssembly
        run: npm run build

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Run performance invariant smoke
        run: npm run benchmark:smoke

      - name: Run Arrow delivery performance smoke
        run: npm run benchmark:arrow

      - name: Enforce package and site size budgets
        run: npm run benchmark:size

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-${{ github.sha }}
          path: |
            target/bench/performance-smoke.json
            target/bench/performance-arrow-*.json
            target/bench/package-sizes.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
